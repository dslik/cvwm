<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Certificates control panel: console-style window (near-black frame, grey title strip), grey body, a certificate with a seal and a key -->
  <rect x="6" y="8" width="52" height="48" fill="#14171a"/>
  <rect x="8" y="10" width="48" height="10" fill="#c4c4c4"/>
  <rect x="8" y="22" width="48" height="32" fill="#d4d7da"/>
  <!-- certificate sheet -->
  <rect x="14" y="27" width="24" height="22" fill="#ffffff" stroke="#2f3b42" stroke-width="1.4"/>
  <path d="M18 32h16M18 36h16M18 40h11" stroke="#2f3b42" stroke-width="1.2" stroke-linecap="round"/>
  <!-- wax seal + ribbon -->
  <circle cx="33" cy="44" r="5" fill="#c06077" stroke="#2f3b42" stroke-width="1.2"/>
  <path d="M31 48l-1.5 5 3.5-2 3.5 2-1.5-5" fill="#c06077" stroke="#2f3b42" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- key -->
  <circle cx="45" cy="30" r="4" fill="none" stroke="#2f3b42" stroke-width="1.8"/>
  <path d="M48 32.5l5 5M51 35.5l2 2M50 36.5l2 2" fill="none" stroke="#2f3b42" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
